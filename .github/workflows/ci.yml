name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify NodeQuality wrapper and artifact contracts
        run: sudo python3 tools/test-nodequality.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p sinan-agent-core --lib --no-run --message-format=json > /tmp/sinan-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/sinan-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sinan_agent_core"))')
          sudo "$diagnostic_test_binary" real_systemd_diagnostic_jobs_survive_manager_recreation_and_enforce_timeout --ignored

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-musl:
    name: Agent musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the native musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 coreutils
      - name: Build and verify the static Agent on its native architecture
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/sinan-artifacts'
      - uses: actions/upload-artifact@v4
        with:
          name: sinan-agent-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/sinan-artifacts/
          if-no-files-found: error
          retention-days: 7
