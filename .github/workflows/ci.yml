name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
