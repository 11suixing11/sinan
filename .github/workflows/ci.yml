name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify NodeQuality wrapper and artifact contracts
        run: sudo python3 tools/test-nodequality.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p sinan-agent-core --lib --no-run --message-format=json > /tmp/sinan-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/sinan-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sinan_agent_core"))')
          sudo "$diagnostic_test_binary" real_systemd_diagnostic_jobs_survive_manager_recreation_and_enforce_timeout --ignored

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-musl:
    name: Agent musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install the native musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 coreutils
      - name: Build the same-source Agent with the previous release profile
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/baseline
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/baseline-artifacts'
      - name: Build and verify the static Agent on its native architecture
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/sinan-artifacts'
      - name: Compare Agent release sizes
        env:
          AGENT_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          architecture = os.environ["AGENT_ARCH"]
          baseline, = (temporary / "baseline-artifacts" / "agent").glob(f"*/{architecture}")
          optimized, = (temporary / "sinan-artifacts" / "agent").glob(f"*/{architecture}")
          before = baseline.stat().st_size
          after = optimized.stat().st_size
          reduction = (before - after) * 100 / before
          report = (
              f"Agent musl {architecture}\n"
              f"baseline_bytes={before}\n"
              f"optimized_bytes={after}\n"
              f"reduction_percent={reduction:.2f}\n"
              "Baseline: strip=none, lto=false, codegen-units=16\n"
              "Optimized: Cargo.toml release profile\n"
              "Both binaries use the same source, target, toolchain, and musl build script.\n"
          )
          (temporary / "sinan-artifacts" / "size-comparison.txt").write_text(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(
                  f"### Agent musl {architecture} size comparison\n\n"
                  "| Profile | Bytes |\n| --- | ---: |\n"
                  f"| Previous release profile | {before} |\n"
                  f"| Optimized release profile | {after} |\n\n"
                  f"Size reduction: {reduction:.2f}%. Both builds use the same source.\n"
              )
          print(report)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-linux-musl-${{ matrix.arch }}
          path: ${{ runner.temp }}/sinan-artifacts/
          if-no-files-found: error
          retention-days: 7
