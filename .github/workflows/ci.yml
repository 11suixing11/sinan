name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify deployment environment initialization
        run: python3 tools/test-init-env.py
      - name: Verify NodeQuality wrapper and artifact contracts
        run: sudo python3 tools/test-nodequality.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p sinan-agent-core --lib --no-run --message-format=json > /tmp/sinan-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/sinan-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sinan_agent_core"))')
          sudo "$diagnostic_test_binary" real_systemd_diagnostic_jobs_survive_manager_recreation_and_enforce_timeout --ignored

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-musl:
    name: Agent musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install the native musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 coreutils
      - name: Build and verify the static Agent on its native architecture
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/sinan-artifacts'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-linux-musl-${{ matrix.arch }}
          path: ${{ runner.temp }}/sinan-artifacts/
          if-no-files-found: error
          retention-days: 7

  agent-native:
    name: Agent ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-gnu
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - platform: linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: windows
            arch: amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - platform: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build, verify, and package the native Agent
        run: python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  agent-freebsd:
    name: Agent FreeBSD 13+ (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: arm64
            vm_arch: aarch64
            target: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify on the FreeBSD 13 baseline
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '13.5'
          arch: ${{ matrix.vm_arch }}
          mem: 8192
          prepare: |
            set -eu
            pkg install -y ca_root_nss curl python3 protobuf
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/sinan-rustup.sh
            sh /tmp/sinan-rustup.sh -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            export PATH="$HOME/.cargo/bin:$PATH"
            export PROTOC=/usr/local/bin/protoc
            export CARGO_TARGET_DIR=/tmp/sinan-agent-target
            python3 tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - name: Check the same binary on FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '14'
          arch: ${{ matrix.vm_arch }}
          run: |
            set -eu
            binary=$(find .ci-artifacts/agent -name sinan-agent -type f)
            test -n "$binary"
            chmod 755 "$binary"
            "$binary" --version
            "$binary" --help
      - name: Check the same binary on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15'
          arch: ${{ matrix.vm_arch }}
          run: |
            set -eu
            binary=$(find .ci-artifacts/agent -name sinan-agent -type f)
            test -n "$binary"
            chmod 755 "$binary"
            "$binary" --version
            "$binary" --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
