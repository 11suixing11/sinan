name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - name: Install the independent Release signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify deployment environment initialization
        run: python3 tools/test-init-env.py
      - name: Verify real acceptance driver and runtime cache contracts
        run: |
          python3 scripts/test-e2e-driver.py
          python3 scripts/test-e2e-runtime.py
          python3 scripts/test-ci-signed-release.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify NodeQuality wrapper and artifact contracts
        run: sudo python3 tools/test-nodequality.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust and PostgreSQL tests
        run: python3 tools/ci-run.py cargo test --locked
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p sinan-agent-core --lib --no-run --message-format=json > /tmp/sinan-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/sinan-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sinan_agent_core"))')
          sudo "$diagnostic_test_binary" real_systemd_diagnostic_jobs_survive_manager_recreation_and_enforce_timeout --ignored

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-linux:
    name: Agent Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            libc: musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
    env:
      PYTHONUTF8: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install compiler and fixture signature support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 python3-cryptography coreutils
      - name: Build and verify the static Agent on its native architecture
        if: matrix.libc == 'musl'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/sinan-artifacts'
      - name: Verify the installer, independent OpenRC services, and diagnostic jobs
        if: matrix.libc == 'musl'
        env:
          SINAN_TEST_AGENT: /src/target/${{ matrix.target }}/release/sinan-agent
        run: bash scripts/ci-openrc-smoke.sh
      - name: Verify native Agent operation and failed-update recovery
        run: python3 tools/agent-smoke.py 'target/${{ matrix.target }}/release/sinan-agent'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-TEST_ONLY-agent-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sinan-artifacts/
          if-no-files-found: error
          retention-days: 7

  real-e2e:
    name: Reality installation and accounting
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: agent-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sinan-TEST_ONLY-agent-linux-musl-amd64
          path: ${{ runner.temp }}/sinan-agent
      - name: Install the independent operator signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Restore the pinned upstream runtime
        id: runtime-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/sinan-runtime-artifacts
          key: sinan-runtime-linux-amd64-1.14.2-${{ hashFiles('tools/build-singbox.sh', 'tools/singbox-builder.Dockerfile') }}
      - name: Build the unchanged upstream runtime on a cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p '${{ runner.temp }}/sinan-runtime-artifacts'
          docker build --platform linux/amd64 -f tools/singbox-builder.Dockerfile -t sinan-ci-runtime-builder .
          docker run --rm --platform linux/amd64 \
            --mount 'type=bind,src=${{ runner.temp }}/sinan-runtime-artifacts,dst=/artifacts' \
            sinan-ci-runtime-builder amd64 /artifacts
          sudo chown -R "$(id -u):$(id -g)" '${{ runner.temp }}/sinan-runtime-artifacts'
          docker image rm sinan-ci-runtime-builder
      - name: Verify the restored or newly built runtime
        run: |
          python3 scripts/verify-e2e-runtime.py \
            '${{ runner.temp }}/sinan-runtime-artifacts' \
            '${{ runner.temp }}/sinan-runtime-check'
      - name: Cache the verified runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/sinan-runtime-artifacts
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Run real installation, Reality traffic, and restart accounting
        run: |
          bash scripts/ci-real-e2e.sh \
            --agent-root '${{ runner.temp }}/sinan-agent' \
            --runtime-root '${{ runner.temp }}/sinan-runtime-artifacts' \
            --summary '${{ runner.temp }}/sinan-real-e2e-summary.json'
      - name: Publish only the allowlisted acceptance summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-real-e2e-summary
          path: ${{ runner.temp }}/sinan-real-e2e-summary.json
          if-no-files-found: warn
          retention-days: 7
