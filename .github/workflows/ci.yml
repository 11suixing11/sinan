name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sinan
          POSTGRES_PASSWORD: sinan-test
          POSTGRES_DB: sinan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sinan:sinan-test@127.0.0.1:5432/sinan_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: '! grep -REin "singbox|sing-box" crates/agent-core'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify NodeQuality wrapper and artifact contracts
        run: sudo python3 tools/test-nodequality.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p sinan-agent-core --lib --no-run --message-format=json > /tmp/sinan-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/sinan-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sinan_agent_core"))')
          sudo "$diagnostic_test_binary" real_systemd_diagnostic_jobs_survive_manager_recreation_and_enforce_timeout --ignored

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-linux:
    name: Agent Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            libc: musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
          - arch: amd64
            libc: gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - arch: arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install the native musl compiler
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 coreutils
      - name: Build the same-source Agent with the previous release profile
        if: matrix.libc == 'musl'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/baseline
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/baseline-artifacts'
      - name: Build and verify the static Agent on its native architecture
        if: matrix.libc == 'musl'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/sinan-artifacts'
      - name: Verify the installer, independent OpenRC services, and diagnostic jobs
        if: matrix.libc == 'musl'
        env:
          SINAN_TEST_AGENT: /src/target/${{ matrix.target }}/release/sinan-agent
        run: bash scripts/ci-openrc-smoke.sh
      - name: Build and verify the dynamic glibc Agent
        if: matrix.libc == 'gnu'
        run: python3 tools/build-agent.py '${{ matrix.target }}' '${{ runner.temp }}/sinan-artifacts'
      - name: Verify native Agent operation and failed-update recovery
        run: python3 tools/agent-smoke.py 'target/${{ matrix.target }}/release/sinan-agent'
      - name: Compare Agent release sizes
        if: matrix.libc == 'musl'
        env:
          AGENT_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          architecture = os.environ["AGENT_ARCH"]
          baseline, = (temporary / "baseline-artifacts" / "agent").glob(f"*/{architecture}")
          optimized, = (temporary / "sinan-artifacts" / "agent").glob(f"*/{architecture}")
          before = baseline.stat().st_size
          after = optimized.stat().st_size
          reduction = (before - after) * 100 / before
          report = (
              f"Agent musl {architecture}\n"
              f"baseline_bytes={before}\n"
              f"optimized_bytes={after}\n"
              f"reduction_percent={reduction:.2f}\n"
              "Baseline: strip=none, lto=false, codegen-units=16\n"
              "Optimized: Cargo.toml release profile\n"
              "Both binaries use the same source, target, toolchain, and musl build script.\n"
          )
          (temporary / "sinan-artifacts" / "size-comparison.txt").write_text(report)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(
                  f"### Agent musl {architecture} size comparison\n\n"
                  "| Profile | Bytes |\n| --- | ---: |\n"
                  f"| Previous release profile | {before} |\n"
                  f"| Optimized release profile | {after} |\n\n"
                  f"Size reduction: {reduction:.2f}%. Both builds use the same source.\n"
              )
          print(report)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sinan-artifacts/
          if-no-files-found: error
          retention-days: 7

  runtime-linux:
    name: Runtime Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: runtime-validation
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - name: Install the pinned runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git curl python3 python3-requests gnupg dirmngr xz-utils unzip bzip2 zstd file binutils binutils-aarch64-linux-gnu build-essential pkg-config coreutils qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross
      - name: Build the complete upstream runtime for the selected libc
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: bash tools/build-singbox.sh "$RUNTIME_ARCH" "$RUNNER_TEMP/runtime-artifacts" "--libc=$RUNTIME_LIBC"
      - name: Run the binary in its target libc and architecture
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime-artifacts/sing-box/1.14.2/linux-$RUNTIME_LIBC-$RUNTIME_ARCH" -C "$RUNNER_TEMP/runtime"
          image=debian:bookworm-slim
          if [ "$RUNTIME_LIBC" = musl ]; then image=alpine:3.24.2; fi
          docker run --rm --network none --platform "linux/$RUNTIME_ARCH" -v "$RUNNER_TEMP/runtime:/runtime:ro" "$image" /runtime/sing-box version
      - name: Verify native configuration, traffic counters, and reload generation
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          binary="$RUNNER_TEMP/runtime/sing-box"
          if [ "$RUNTIME_ARCH" = arm64 ]; then
            printf '#!/bin/sh\nexec qemu-aarch64-static -L /usr/aarch64-linux-gnu "%s" "$@"\n' "$binary" > "$RUNNER_TEMP/runtime/run-runtime"
            chmod 755 "$RUNNER_TEMP/runtime/run-runtime"
            binary="$RUNNER_TEMP/runtime/run-runtime"
          fi
          SINAN_TEST_SINGBOX="$binary" cargo test --locked --package sinan-adapter-singbox --test runtime -- --ignored
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-runtime-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/
          if-no-files-found: error
          retention-days: 7

  agent-native:
    name: Agent ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: windows
            arch: amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - platform: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build, verify, and package the native Agent
        run: python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - name: Verify native Agent operation and failed-update recovery
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/sinan-agent
          if [ '${{ matrix.platform }}' = windows ]; then binary="$binary.exe"; fi
          python tools/agent-smoke.py "$binary"
      - name: Build the pinned upstream native runtime
        run: python tools/build-runtime-native.py '${{ matrix.platform }}-${{ matrix.arch }}' .ci-artifacts
      - name: Verify native service installation and independent runtime
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/sinan-agent
          runtime=.ci-artifacts/sing-box/1.14.2/${{ matrix.platform }}-${{ matrix.arch }}
          if [ '${{ matrix.platform }}' = windows ]; then
            python tools/native-service-smoke.py "$binary.exe" "$runtime"
          else
            sudo env CI=true "$(command -v python)" tools/native-service-smoke.py "$binary" "$runtime"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  agent-freebsd:
    name: Agent FreeBSD 13+ (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/sinan-freebsd-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: arm64
            vm_arch: aarch64
            target: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: freebsd-cross-${{ matrix.target }}
          workspaces: . -> /tmp/sinan-freebsd-target
          cache-directories: ~/.cargo/bin
      - name: Install the reference cross compiler
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Cross compile using the FreeBSD 13 sysroot
        id: build
        env:
          AGENT_TARGET: ${{ matrix.target }}
        run: |
          cross build --locked --release --package sinan-agent --target "$AGENT_TARGET"
          mkdir -p .ci-binaries
          cp "$CARGO_TARGET_DIR/$AGENT_TARGET/release/sinan-agent" .ci-binaries/sinan-agent
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import tomllib

          target = os.environ['AGENT_TARGET']
          runpy.run_path('tools/build-agent.py')['verify_architecture'](Path('.ci-binaries/sinan-agent'), target)
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build the pinned upstream FreeBSD runtime
        run: python3 tools/build-runtime-native.py 'freebsd-${{ matrix.arch }}' .ci-artifacts
      - name: Verify the binary on FreeBSD 13.5
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '13.5'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            chmod 755 .ci-binaries/sinan-agent
            test "$(.ci-binaries/sinan-agent --version)" = 'sinan-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/sinan-agent --help
            mkdir -p /tmp/sinan-runtime
            tar -xzf .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} -C /tmp/sinan-runtime
            /tmp/sinan-runtime/sing-box version
      - name: Verify the same binary on FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '14'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            test "$(.ci-binaries/sinan-agent --version)" = 'sinan-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/sinan-agent --help
            mkdir -p /tmp/sinan-runtime
            tar -xzf .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} -C /tmp/sinan-runtime
            /tmp/sinan-runtime/sing-box version
      - name: Verify and package the same binary on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15'
          arch: ${{ matrix.vm_arch }}
          copyback: true
          prepare: pkg install -y python3
          run: |
            set -eu
            python3 tools/build-agent.py '${{ matrix.target }}' .ci-artifacts --binary .ci-binaries/sinan-agent
            python3 tools/agent-smoke.py .ci-binaries/sinan-agent
            env CI=true python3 tools/native-service-smoke.py .ci-binaries/sinan-agent .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-runtime-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
