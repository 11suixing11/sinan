name: Agent platform artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  agent-native:
    name: Agent ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-gnu
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - platform: linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: windows
            arch: amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - platform: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build, verify, and package the native Agent
        run: python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  agent-freebsd:
    name: Agent FreeBSD 13+ (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/sinan-freebsd-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: arm64
            vm_arch: aarch64
            target: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: freebsd-cross-${{ matrix.target }}
          workspaces: . -> /tmp/sinan-freebsd-target
          cache-directories: ~/.cargo/bin
      - name: Install the reference cross compiler
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Cross compile using the FreeBSD 13 sysroot
        id: build
        env:
          AGENT_TARGET: ${{ matrix.target }}
        run: |
          cross build --locked --release --package sinan-agent --target "$AGENT_TARGET"
          mkdir -p .ci-binaries
          cp "$CARGO_TARGET_DIR/$AGENT_TARGET/release/sinan-agent" .ci-binaries/sinan-agent
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import tomllib

          target = os.environ['AGENT_TARGET']
          runpy.run_path('tools/build-agent.py')['verify_architecture'](Path('.ci-binaries/sinan-agent'), target)
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Verify the binary on FreeBSD 13.5
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '13.5'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            chmod 755 .ci-binaries/sinan-agent
            test "$(.ci-binaries/sinan-agent --version)" = 'sinan-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/sinan-agent --help
      - name: Verify the same binary on FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '14'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            test "$(.ci-binaries/sinan-agent --version)" = 'sinan-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/sinan-agent --help
      - name: Verify and package the same binary on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15'
          arch: ${{ matrix.vm_arch }}
          copyback: true
          prepare: pkg install -y python3
          run: |
            set -eu
            python3 tools/build-agent.py '${{ matrix.target }}' .ci-artifacts --binary .ci-binaries/sinan-agent
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sinan-agent-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
